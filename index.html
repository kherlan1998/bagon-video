<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagon Secret Video</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #000; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .qr-container { background: white; padding: 20px; border-radius: 15px; }
        img { width: 300px; height: 300px; display: block; }
        #video-section { display: none; width: 90%; max-width: 600px; padding: 20px; }
        video { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 0 25px rgba(255,255,255,0.3); background: #111; }
        .btn { margin-top: 20px; padding: 15px 30px; background: #2ecc71; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="qr-section">
        <h1>Scan to Unlock Video</h1>
        <div class="qr-container">
            <img src="qr-code.png" alt="QR Code">
        </div>
    </div>

    <div id="video-section">
        <h1>Video Unlocked!</h1>
        <video id="myVideo" controls playsinline autoplay muted>
            <source src="bagon.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <button class="btn" onclick="const v=document.getElementById('myVideo'); v.muted=false; v.play();">▶ PLAY WITH SOUND</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('scan') === 'true') {
            document.getElementById('qr-section').style.display = 'none';
            document.getElementById('video-section').style.display = 'block';
            document.getElementById('myVideo').load(); // Force the video to reload the new file
        }
    </script>
</body>
</html>
