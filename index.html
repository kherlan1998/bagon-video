<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagon Secret Video</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 40px 20px; }
        .qr-container { background: white; padding: 20px; display: inline-block; border-radius: 15px; }
        img { width: 300px; height: 300px; }
        video { width: 100%; max-width: 600px; border-radius: 15px; display: none; } /* Hidden by default */
        #message { margin-bottom: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="qr-section">
        <h1>Scan to unlock video</h1>
        <div class="qr-container">
            <img src="qr-code.png" alt="QR Code">
        </div>
    </div>

    <div id="video-section" style="display:none;">
        <h1>Bagon Video Unlocked!</h1>
        <video id="myVideo" controls playsinline>
            <source src="bagon.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        // Check if the URL ends with ?scan=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('scan') === 'true') {
            document.getElementById('qr-section').style.display = 'none';
            document.getElementById('video-section').style.display = 'block';
            document.getElementById('myVideo').play();
        }
    </script>
</body>
</html>
