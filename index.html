<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagon QR Code & Video</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .qr-box { background: white; padding: 15px; display: inline-block; border-radius: 12px; margin-top: 10px; }
        img { width: 280px; height: 280px; display: block; }
        video { width: 100%; max-width: 500px; border-radius: 10px; margin-top: 30px; border: 2px solid #333; }
        h1 { margin-bottom: 5px; font-size: 1.5rem; }
        p { color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Scan or Screenshot Me</h1>
    <div class="qr-box">
        <img src="qr-code.png" alt="QR Code">
    </div>
    <p>Scan this to see the video!</p>

    <hr style="border: 0.5px solid #333; margin: 40px 0;">

    <h2>Watch bagon.mp4</h2>
    <video controls autoplay muted playsinline>
        <source src="bagon.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
